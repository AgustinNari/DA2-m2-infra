name: Infra CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: m2
      POSTGRES_USER: m2_app
      POSTGRES_PASSWORD: ci-dummy-password
      MOCK_CITIZEN_PASSWORD: ci-citizen-password
      MOCK_AGENT_PASSWORD: ci-agent-password
      MOCK_AREA_RESPONSIBLE_PASSWORD: ci-area-password
      MOCK_ADMIN_PASSWORD: ci-admin-password
      SIMULATOR_ENABLED: "false"
      ATTACHMENT_STORAGE_ROOT: /var/lib/m2/attachments
      BACKEND_IMAGE: ghcr.io/juanmaguida/backend-damii:sha-0000000000000000000000000000000000000000
      FRONTEND_IMAGE: ghcr.io/santimussi/front-desarrollo-apps-2:sha-0000000000000000000000000000000000000000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate local Compose configuration
        working-directory: compose
        env:
          FRONTEND_PORT: "8081"
        run: docker compose config --quiet

      - name: Validate Lightsail Compose configuration
        working-directory: compose
        env:
          FRONTEND_PORT: "80"
        run: docker compose --env-file .env.example --env-file images.env.example -f compose.deploy.yml config --quiet

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check

      - name: Initialize Terraform without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate
